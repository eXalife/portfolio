<div class="card">
    <div #canvasContainer class="canvas-container"></div>

    <div class="overlay-layer">
        <header class="top-bar">
            <a class="glass-control license-badge text-sm" [href]="currentModel().link" target="_blank" rel="noopener"
                [title]="'View source: ' + currentModel().name">
                {{ currentModel().license }}
            </a>
        </header>

        <button type="button" class="glass-control nav-btn prev-btn" (click)="prevModel()" [disabled]="loading()"
            aria-label="Previous Model">
            <svg width="1.5rem" height="1.5rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>

        <button type="button" class="glass-control nav-btn next-btn" (click)="nextModel()" [disabled]="loading()"
            aria-label="Next Model">
            <svg width="1.5rem" height="1.5rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>

        @if (loading()) {
        <div class="bottom-bar">
            <div class="glass-control progress-panel">
                <span class="progress-label">{{ progressDetails() }}</span>

                @if (progressBytes().total > 0) {
                <p-progressBar [value]="progress()" mode="determinate" [showValue]="false">
                </p-progressBar>
                } @else {
                <p-progressBar mode="indeterminate" [showValue]="false">
                </p-progressBar>
                }
            </div>
        </div>
        }
    </div>
</div>
