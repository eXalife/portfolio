<ul class="layout-menu" role="menu" (keydown)="onKeydown($event)">
  <ng-container *ngFor="let item of model; let i = index">
    <ng-container *ngTemplateOutlet="menuItemTemplate; context: { $implicit: item, root: true }"></ng-container>
  </ng-container>
</ul>

<ng-template #menuItemTemplate let-item let-root="root">
  <li [ngClass]="{ 'layout-root-menuitem': root, 'active-menuitem': activeItems.has(item) }" role="none">

    <div *ngIf="root && item.visible !== false" class="layout-menuitem-root-text">{{item.label}}</div>
    <a *ngIf="(!item.routerLink || item.items) && item.visible !== false" [attr.href]="item.url"
      (click)="itemClick($event, item)" [ngClass]="item.class" [attr.target]="item.target" tabindex="0" pRipple>
      <i [ngClass]="item.icon" class="layout-menuitem-icon"></i>
      <span class="layout-menuitem-text">{{item.label}}</span>
      <i class="pi pi-fw pi-angle-down layout-submenu-toggler" *ngIf="item.items"></i>
    </a>

    <a *ngIf="(item.routerLink && !item.items) && item.visible !== false" (click)="itemClick($event, item)"
      [ngClass]="item.class" [routerLink]="item.routerLink" routerLinkActive="active-route"
      [routerLinkActiveOptions]="item.routerLinkActiveOptions||{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
      [fragment]="item.fragment" [queryParamsHandling]="item.queryParamsHandling"
      [preserveFragment]="item.preserveFragment" [skipLocationChange]="item.skipLocationChange"
      [replaceUrl]="item.replaceUrl" [state]="item.state" [queryParams]="item.queryParams" [attr.target]="item.target"
      tabindex="0" pRipple>
      <i [ngClass]="item.icon" class="layout-menuitem-icon"></i>
      <span class="layout-menuitem-text">{{item.label}}</span>
      <i class="pi pi-fw pi-angle-down layout-submenu-toggler" *ngIf="item.items"></i>
    </a>

    <ul *ngIf="item.items && item.visible !== false" [@children]="getSubmenuAnimation(item, root)">
      <ng-container *ngFor="let child of item.items">
        <ng-container *ngTemplateOutlet="menuItemTemplate; context: { $implicit: child, root: false }"></ng-container>
      </ng-container>
    </ul>
  </li>
</ng-template>
